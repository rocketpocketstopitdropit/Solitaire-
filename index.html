<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Klondike solitaire that tells you when you're out of useful moves, and whether the deal could have been won.">
<meta name="theme-color" content="#12301f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Solitaire">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
[hidden]{display:none!important}
</style>
<title>Klondike Solitaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,700;1,6..96,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen card table. Status strip on top, felt board fills the middle, thumb toolbar at the bottom. */
:root{
  --felt:#235441;
  --felt-deep:#12301f;
  --ink:#f3efe4;
  --ink-dim:rgba(243,239,228,.62);
  --card:#fbf8f1;
  --card-edge:#d8d0bf;
  --red:#c1322b;
  --black:#1c2026;
  --back:#7b2431;
  --brass:#d8b46a;
  --loss:#e08a7a;
  --panel:#0f281c;
  --font-display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --font-ui:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-suit:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",system-ui,sans-serif;
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%;background:var(--felt-deep)}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;overflow:hidden;
  background:radial-gradient(ellipse 120% 80% at 50% 38%,var(--felt) 0%,var(--felt-deep) 100%),var(--felt-deep);
  color:var(--ink);font-family:var(--font-ui);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
}
.app{height:100%;max-width:640px;margin:0 auto;padding-inline:16px;display:flex;flex-direction:column}

/* status strip */
.bar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 14px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;line-height:1;white-space:nowrap}
.brand .deal{font-family:var(--font-ui);font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);margin-left:8px}
.stats{display:flex;gap:14px;font-size:13px;color:var(--ink-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats b{color:var(--ink);font-weight:600}

/* table */
.board{position:relative;flex:1;min-height:0;touch-action:none}
.slot{
  position:absolute;width:var(--cw);height:var(--ch);
  border-radius:calc(var(--cw)*.1);border:1.5px solid rgba(243,239,228,.17);
  background:rgba(0,0,0,.08);
  display:grid;place-items:center;
  color:rgba(243,239,228,.26);font-family:var(--font-display);font-weight:600;font-size:calc(var(--cw)*.42);
}
.slot.stock{cursor:pointer}
.slot.stock span{font-family:var(--font-ui);font-weight:500;font-size:calc(var(--cw)*.5)}

.card{
  position:absolute;width:var(--cw);height:var(--ch);
  perspective:700px;cursor:pointer;
  transition:left .22s cubic-bezier(.2,.8,.2,1),top .22s cubic-bezier(.2,.8,.2,1);
  transition-delay:var(--d,0ms);
}
.card.dragging{transition:none;cursor:grabbing}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform .3s ease;transition-delay:var(--fd,0ms)}
.card.up .inner{transform:rotateY(0deg)}
.face,.back{
  position:absolute;inset:0;border-radius:calc(var(--cw)*.1);
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.face{
  background:var(--card);border:1px solid var(--card-edge);color:var(--black);
  box-shadow:0 1px 0 rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.2);
}
.face.red{color:var(--red)}
.back{
  transform:rotateY(180deg);
  background:
    repeating-linear-gradient(45deg,rgba(216,180,106,.32) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(-45deg,rgba(216,180,106,.32) 0 1px,transparent 1px 5px),
    var(--back);
  border:1px solid var(--card-edge);
  box-shadow:inset 0 0 0 calc(var(--cw)*.055) var(--card),0 1px 0 rgba(0,0,0,.22),0 2px 6px rgba(0,0,0,.2);
}
.rk{position:absolute;left:calc(var(--cw)*.08);top:calc(var(--cw)*.05);font-family:var(--font-display);font-weight:700;font-size:calc(var(--cw)*.34);line-height:1;letter-spacing:-.05em}
.st{position:absolute;right:calc(var(--cw)*.08);top:calc(var(--cw)*.06);font-family:var(--font-suit);font-size:calc(var(--cw)*.3);line-height:1}
.pip{position:absolute;inset-inline:0;bottom:calc(var(--ch)*.13);text-align:center;font-family:var(--font-suit);font-size:calc(var(--cw)*.62);line-height:1}
.pip.court{font-family:var(--font-display);font-style:italic;font-weight:600;font-size:calc(var(--cw)*.6)}
.still .card,.still .inner{transition:none!important}

.card.hint .face,.slot.hint{animation:glow 1.3s ease-out}
@keyframes glow{0%,60%{box-shadow:0 0 0 2px var(--brass),0 0 16px 2px rgba(216,180,106,.75)}100%{box-shadow:0 0 0 0 transparent}}
.card.nope{animation:nope .26s}
@keyframes nope{0%,100%{translate:0}25%{translate:-4px 0}75%{translate:4px 0}}

/* toolbar */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:10px 12px}
.tools button{
  appearance:none;height:48px;border-radius:12px;
  border:1px solid rgba(216,180,106,.35);background:rgba(0,0,0,.2);color:var(--ink);
  font:600 14px/1 var(--font-ui);display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
}
.tools button svg{width:18px;height:18px;stroke:var(--brass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools button:active{background:rgba(216,180,106,.14)}
.tools button:disabled{opacity:.38}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* sheets + win overlay */
.overlay{position:fixed;inset:0;z-index:5000;background:rgba(4,14,9,.6);display:flex;justify-content:center}
.sheet{align-items:flex-end}
.panel{
  width:100%;max-width:640px;background:var(--panel);border:1px solid rgba(216,180,106,.22);
  display:grid;gap:10px;
}
.sheet .panel{border-radius:18px 18px 0 0;border-bottom:0;padding:20px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.panel h2{margin:0 0 2px;font-family:var(--font-display);font-weight:700;font-size:24px;text-wrap:balance}
.panel .note{margin:0 0 6px;color:var(--ink-dim);font-size:13px;font-variant-numeric:tabular-nums}
.opt{
  appearance:none;text-align:left;width:100%;cursor:pointer;
  border:1px solid rgba(243,239,228,.14);background:rgba(255,255,255,.04);color:var(--ink);
  border-radius:12px;padding:12px 14px;display:grid;gap:3px;font-family:var(--font-ui);
}
.opt b{font-size:15px;font-weight:600}
.opt span{font-size:13px;color:var(--ink-dim)}
.opt.current,.opt.lead{border-color:var(--brass)}
.opt.lead{background:rgba(216,180,106,.12)}
.opt:disabled{opacity:.4;cursor:default}
.opt.plain{text-align:center;background:none;border-color:transparent;color:var(--ink-dim);font-size:15px;font-weight:500;padding-block:10px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .opt{text-align:center;padding-block:12px}

/* verdict on the stuck sheet */
.verdict{display:grid;gap:6px;padding:14px;border-radius:12px;background:rgba(0,0,0,.22);margin-bottom:4px}
.chip{justify-self:start;display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 8px;border-radius:999px;
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border:1px solid currentColor}
.chip i{font-style:normal;font-family:var(--font-suit);font-size:13px;letter-spacing:0;text-transform:none}
.verdict[data-v="win"] .chip{color:var(--brass)}
.verdict[data-v="lose"] .chip{color:var(--loss)}
.verdict[data-v="unknown"] .chip,.verdict[data-v="pending"] .chip{color:var(--ink-dim)}
.verdict[data-v="pending"] .chip i{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.verdict p{margin:0;font-size:15px;line-height:1.45;max-width:60ch}

.win{align-items:center;padding-inline:16px}
.win .panel{border-radius:18px;padding:28px 20px 20px;text-align:center;max-width:360px;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.win h2{font-size:40px;font-style:italic}
.win .suits{font-family:var(--font-suit);font-size:20px;letter-spacing:.3em;color:var(--brass)}
.primary{appearance:none;height:48px;border:0;border-radius:12px;background:var(--brass);color:#1a1408;font:600 15px var(--font-ui);cursor:pointer;margin-top:6px}

.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  z-index:4000;background:var(--panel);border:1px solid rgba(216,180,106,.3);color:var(--ink);
  padding:10px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);text-align:center;
  transition:opacity .2s;pointer-events:none;
}
.toast.off{opacity:0}

/* game review: replaces the toolbar while you step through a finished game */
.review{display:grid;gap:8px;padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(216,180,106,.22)}
.rv-head{display:flex;align-items:center;gap:8px}
.seg{flex:1;display:grid;grid-template-columns:1fr 1fr;padding:3px;border-radius:11px;background:rgba(0,0,0,.28);border:1px solid rgba(243,239,228,.1)}
.seg button{appearance:none;border:0;background:none;color:var(--ink-dim);font:600 13px/1 var(--font-ui);height:34px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:rgba(216,180,106,.18);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(216,180,106,.5)}
.seg button:disabled{opacity:.35;cursor:default}
.rv-icon{appearance:none;height:40px;min-width:40px;padding-inline:10px;border-radius:10px;border:1px solid rgba(243,239,228,.14);background:none;color:var(--ink);font:600 13px var(--font-ui);cursor:pointer}
.rv-meta{display:flex;align-items:center;gap:8px;min-height:24px;font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.rv-meta .count{letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.rv-meta .state{padding:2px 8px;border-radius:999px;border:1px solid currentColor;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.rv-meta .state.ok{color:var(--brass)}
.rv-meta .state.lost{color:var(--loss)}
.rv-meta .state.maybe{color:var(--ink-dim)}
.rv-meta .jump{margin-left:auto;appearance:none;border:0;background:none;color:var(--brass);font:600 13px var(--font-ui);cursor:pointer;padding:4px 0}
.rv-body{min-height:64px;display:grid;gap:6px;align-content:start}
.rv-text{margin:0;font-size:15px;line-height:1.4}
.rv-sub{margin:0;font-size:13px;line-height:1.4;color:var(--ink-dim)}
.rv-row{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;font-size:14.5px;line-height:1.35}
.tag{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:6px;white-space:nowrap}
.tag.you{color:var(--felt-deep);background:var(--ink)}
.tag.win{color:#1a1408;background:var(--brass)}
.rv-nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rv-nav button{
  appearance:none;height:46px;border-radius:12px;border:1px solid rgba(216,180,106,.35);background:rgba(0,0,0,.2);color:var(--ink);
  font:600 14px/1 var(--font-ui);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
}
.rv-nav button:active{background:rgba(216,180,106,.14)}
.rv-nav button:disabled{opacity:.35}
.rv-nav button.go{background:rgba(216,180,106,.16)}
/* outlines on the table: white for your move, brass for the winning move */
.card.mark-you::after,.card.mark-win::after{content:"";position:absolute;inset:-3px;border-radius:calc(var(--cw)*.13);pointer-events:none;z-index:2}
.card.mark-you::after{border:2.5px solid var(--ink);box-shadow:0 0 10px rgba(243,239,228,.5)}
.card.mark-win::after{border:2.5px solid var(--brass);box-shadow:0 0 12px rgba(216,180,106,.8)}
.card.mark-you.mark-win::after{border-style:dashed}
.slot.mark-you{border-color:var(--ink);border-width:2.5px}
.slot.mark-win{border-color:var(--brass);border-width:2.5px}
.opt.review-opt{border-color:rgba(216,180,106,.45)}
.seg.level{grid-template-columns:repeat(3,1fr);flex:none}
.seg.level button{height:38px;font-size:14px}

@media (prefers-reduced-motion:reduce){
  .card,.inner{transition:none!important}
  .card.nope,.card.hint .face,.slot.hint,.panel,.verdict .chip i{animation:none!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">Klondike<span class="deal" id="mode">Normal · Draw 1</span></div>
    <div class="stats">
      <span><b id="moves">0</b> moves</span>
      <span><b id="time">0:00</b></span>
    </div>
  </header>
  <main class="board" id="board" aria-label="Card table"></main>
  <nav class="tools">
    <button id="btnNew" type="button"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="11" height="15" rx="2"/><path d="M9 3h9a2 2 0 0 1 2 2v12"/></svg>New game</button>
    <button id="btnHint" type="button"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg>Hint</button>
    <button id="btnUndo" type="button"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
  </nav>
  <section class="review" id="review" aria-label="Game review" hidden>
    <div class="rv-head">
      <div class="seg" role="tablist">
        <button id="rvYou" type="button" role="tab" aria-selected="true">Your game</button>
        <button id="rvWin" type="button" role="tab" aria-selected="false">Winning line</button>
      </div>
      <button class="rv-icon" id="rvReplay" type="button">Replay deal</button>
      <button class="rv-icon" id="rvClose" type="button" aria-label="Close review">✕</button>
    </div>
    <div class="rv-meta">
      <span class="count" id="rvCount"></span>
      <span class="state" id="rvState" hidden></span>
      <button class="jump" id="rvJump" type="button" hidden>Turning point</button>
    </div>
    <div class="rv-body" id="rvBody" aria-live="polite"></div>
    <div class="rv-nav">
      <button id="rvStart" type="button" aria-label="Back to the deal">⏮︎</button>
      <button id="rvPrev" type="button">‹ Back</button>
      <button id="rvNext" type="button" class="go">Next ›</button>
      <button id="rvPlay" type="button">Play</button>
    </div>
  </section>
</div>

<div class="overlay sheet" id="sheet" hidden>
  <div class="panel" role="dialog" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">New game</h2>
    <p class="note" id="record">No games played yet</p>
    <div class="seg level" role="tablist" aria-label="Difficulty">
      <button type="button" role="tab" data-level="easy">Easy</button>
      <button type="button" role="tab" data-level="normal">Normal</button>
      <button type="button" role="tab" data-level="hard">Hard</button>
    </div>
    <p class="note" id="levelNote"></p>
    <button class="opt" id="optD1" type="button"><b>Deal · Draw 1</b><span>Turn one card at a time.</span></button>
    <button class="opt" id="optD3" type="button"><b>Deal · Draw 3</b><span>Turn three at a time. The classic rules, and much harder.</span></button>
    <button class="opt" id="optReplay" type="button"><b id="replayLabel">Replay this deal</b><span>Start the same cards over from the beginning.</span></button>
    <button class="opt review-opt" id="optReview" type="button"><b>Review this game</b><span>Check whether it can still be won, and where it went wrong if not.</span></button>
    <button class="opt plain" id="optClose" type="button">Keep playing</button>
  </div>
</div>

<div class="overlay sheet" id="stuck" hidden>
  <div class="panel" role="dialog" aria-labelledby="stuckTitle">
    <h2 id="stuckTitle">No more useful moves</h2>
    <p class="note" id="stuckNote"></p>
    <div class="verdict" id="verdict" data-v="pending" aria-live="polite">
      <span class="chip"><i id="verdictMark">♠&#xFE0E;</i><span id="verdictChip">Checking</span></span>
      <p id="verdictText"></p>
    </div>
    <button class="opt review-opt" id="stReview" type="button"><b>Review this game</b><span>Find the move that lost it, and see the winning line from there.</span></button>
    <div class="pair">
      <button class="opt" id="stRestart" type="button"><b>Restart this deal</b></button>
      <button class="opt" id="stNew" type="button"><b>New deal</b></button>
    </div>
    <button class="opt plain" id="stUndo" type="button">Undo last move</button>
    <button class="opt plain" id="stClose" type="button">Look at the table</button>
  </div>
</div>

<div class="overlay win" id="win" hidden>
  <div class="panel" role="dialog" aria-labelledby="winTitle">
    <div class="suits">♠&#xFE0E;♥&#xFE0E;♦&#xFE0E;♣&#xFE0E;</div>
    <h2 id="winTitle">Solved</h2>
    <p class="note" id="winLine"></p>
    <p class="note" id="winRecord"></p>
    <button class="primary" id="btnAgain" type="button">Deal another</button>
  </div>
</div>

<div class="toast off" id="toast" role="status" aria-live="polite"></div>

<script id="klsrc">
// Klondike solver and "stuck" detector. Plain functions with no dependencies,
// so the same file runs in the game's Web Worker and in Node tests.
//
// Positions use card numbers 0..51: suit * 13 + (rank - 1), suits in the order
// spades, hearts, diamonds, clubs. A position is:
//   { cols: [7 arrays, bottom card first], down: [face-down count per column],
//     found: [cards on the foundation per suit], talon: [...], w, draw }
// The talon is the waste and stock as one list in the order cards are dealt:
// talon[0..w] is the waste (talon[w] on top), the rest is the stock.
// Turning the stock moves w forward by `draw` cards; at the end it goes back to -1.

var KL = (function () {
  var OPP = [[1, 2], [0, 3], [0, 3], [1, 2]];
  function suit(c) { return (c / 13) | 0; }
  function rank(c) { return c % 13; }
  function red(c) { var s = (c / 13) | 0; return s === 1 || s === 2; }

  function hash(s) {
    var h1 = 0x811c9dc5, h2 = 0x9e3779b9;
    for (var i = 0; i < s.length; i++) {
      var c = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ c, 16777619);
      h2 = Math.imul(h2 ^ c, 0x5bd1e995); h2 ^= h2 >>> 13;
    }
    return (h1 >>> 0) * 2097152 + ((h2 >>> 0) & 0x1fffff);
  }

  // ---------- full solver (sees every card) ----------
  // Returns { result: 'win' | 'lose' | 'unknown', nodes }.
  function solve(inp, opts) {
    opts = opts || {};
    var maxNodes = opts.maxNodes || 1e9;
    var deadline = opts.deadline || Infinity;
    var cols = inp.cols.map(function (c) { return c.slice(); });
    var down = inp.down.slice(), found = inp.found.slice();
    var talon = inp.talon.slice(), w = inp.w, N = inp.draw;
    var nodes = 0, aborted = false;
    var TBITS = opts.tableBits || 22, TSIZE = 1 << TBITS, TMASK = TSIZE - 1, table = new Float64Array(TSIZE), filled = 0;
    var tpos = new Int8Array(52).fill(-1);
    for (var ti = 0; ti < talon.length; ti++) tpos[talon[ti]] = ti;
    var tmask = 0;
    for (ti = 0; ti < talon.length; ti++) tmask |= 1 << ti;
    function fmix(h) { h ^= h >>> 16; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); return h ^ (h >>> 16); }
    function stateHash() {
      var sa = 0, sb = 0;
      for (var i = 0; i < 7; i++) {
        var p = cols[i], a = 0x9e3779b9 ^ down[i], b = 0x27d4eb2f + down[i] * 977;
        for (var j = 0; j < p.length; j++) {
          a = Math.imul(a ^ (p[j] + 1), 0x01000193);
          b = Math.imul(b + p[j] + 7, 0xcc9e2d51); b = (b << 15) | (b >>> 17);
        }
        sa = (sa + fmix(a)) | 0; sb = (sb + fmix(b ^ 0x5bd1e995)) | 0;
      }
      var f = found[0] | (found[1] << 4) | (found[2] << 8) | (found[3] << 12) | ((N === 1 ? 0 : w + 1) << 16);

function tap(id){

  if(isTop && ref.k !== 'f'){

/* ---------- end of game ---------- */

function win(){

}

/* ---------- stuck: no useful moves left ---------- */

function isStuck(){

const VERDICTS = {

/* ---------- hints ---------- */
function findHint(){
  const wTop = last(S.waste);
  const tops = [];
  if(wTop) tops.push(wTop);
  S.t.forEach(col => col.length && tops.push(last(col)));
  for(const id of tops) for(let f = 0; f < 4; f++) if(canFound(id, f)) return {src:id, dst:{k:'f', i:f}};
  for(let c = 0; c < 7; c++){
    const col = S.t[c], i = col.findIndex(id => S.up[id]);
    if(i <= 0) continue;
    for(let d = 0; d < 7; d++) if(d !== c && canTab(col[i], d)) return {src:col[i], dst:{k:'t', i:d}};
  }
  if(wTop) for(let d = 0; d < 7; d++) if(canTab(wTop, d)) return {src:wTop, dst:{k:'t', i:d}};

}
function flash(el){ if(!el) return; el.classList.remove('hint'); void el.offsetWidth; el.classList.add('hint'); setTimeout(() => el.classList.remove('hint'), 1400); }
function hint(){

  if(h.stock){
    flash(S.stock.length ? els[last(S.stock)] : slots.s);
    toast(S.stock.length ? 'Draw from the stock' : 'Tap the empty stock to turn the waste over');
    return;

let toastTimer;

/* ---------- layout & render ---------- */
function makeCard(id){
  const {suit, rank} = info(id), court = rank > 10;
  const el = document.createElement('div');
  el.className = 'card'; el.dataset.id = id;
  el.innerHTML = `<div class="inner"><div class="face${isRed(suit) ? ' red' : ''}"><span class="rk">${RANKS[rank]}</span><span class="st">${SYM[suit]}</span><span class="pip${court ? ' court' : ''}">${court ? RANKS[rank] : SYM[suit]}</span></div><div class="back"></div></div>`;
  el.setAttribute('aria-label', `${RANK_NAME[rank]} of ${SUIT_NAME[suit]}`);
  board.appendChild(el);
  return el;
}
function makeSlot(key, label, cls){
  const el = document.createElement('div');
  el.className = 'slot' + (cls ? ' ' + cls : ''); el.dataset.slot = key;
  el.innerHTML = label;
  board.appendChild(el);
  return slots[key] = el;
}
function computeLayout(){
  const W = board.clientWidth, H = board.clientHeight;
  const gap = Math.max(4, Math.round(W * 0.014));
  let cw = Math.floor((W - 6 * gap) / 7);
  cw = Math.max(24, Math.min(cw, Math.floor(H / 4.4)));
  const ch = Math.round(cw * 1.4);
  const ox = Math.round((W - (7 * cw + 6 * gap)) / 2);

  board.style.setProperty('--cw', cw + 'px');
  board.style.setProperty('--ch', ch + 'px');
  const put = (el, x, y) => { el.style.left = x + 'px'; el.style.top = y + 'px'; };
  put(slots.s, G.x(0), 0);
  for(let f = 0; f < 4; f++) put(slots['f' + f], G.x(3 + f), 0);
  for(let c = 0; c < 7; c++) put(slots['t' + c], G.x(c), G.tabY);
}
function render(boost){
  const lift = new Set(boost || []);
  const place = (id, x, y, z) => {
    const el = els[id];
    el.style.left = x + 'px'; el.style.top = y + 'px';
    el.dataset.z = z;
    el.style.zIndex = lift.has(id) ? 1000 + z : z;
    el.classList.toggle('up', !!S.up[id]);
  };

  const n = S.waste.length, fanCount = S.draw === 3 ? Math.min(3, n) : 1;
  S.waste.forEach((id, i) => {
    const fromTop = n - 1 - i;

    place(id, x, 0, 100 + i);
  });
  S.f.forEach((pile, f) => pile.forEach((id, i) => place(id, G.x(3 + f), 0, 200 + i)));

  S.t.forEach((col, c) => {
    let need = 0;
    for(let i = 0; i < col.length - 1; i++) need += S.up[col[i]] ? upGap : down;
    const k = need > avail && need > 0 ? Math.max(0, avail) / need : 1;
    let y = G.tabY;
    col.forEach((id, i) => { place(id, G.x(c), Math.round(y), 300 + i); if(i < col.length - 1) y += (S.up[id] ? upGap : down) * k; });
    G.colBottom[c] = Math.round(y) + G.ch;
  });

}
function hud(){
  $('moves').textContent = S.moves;
  $('time').textContent = fmt(S.elapsed);
  $('mode').textContent = LEVELS[levelOf(S)].name + ' · Draw ' + S.draw;
  $('btnUndo').disabled = !history.length;
}
const fmt = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

function dealAnim(){
  if(reduced){ render(); scheduleStuck(); return; }
  board.classList.add('still');
  Object.values(els).forEach(el => { el.style.left = G.x(0) + 'px'; el.style.top = '0px'; el.classList.remove('up'); });
  void board.offsetWidth;
  board.classList.remove('still');
  let k = 0;
  for(let r = 0; r < 7; r++) for(let c = r; c < 7; c++){
    const el = els[S.t[c][r]];
    el.style.setProperty('--d', (k * 30) + 'ms');
    el.style.setProperty('--fd', (k * 30 + 180) + 'ms');
    k++;
  }
  busy = true;
  render();
  setTimeout(() => { Object.values(els).forEach(el => { el.style.removeProperty('--d'); el.style.removeProperty('--fd'); }); busy = false; scheduleStuck(); }, k * 30 + 520);

/* ---------- pointer: tap or drag ---------- */
board.addEventListener('pointerdown', e => {
  if(busy || R || (e.button && e.button !== 0)) return;
  const cardEl = e.target.closest('.card'), slotEl = e.target.closest('.slot');
  P = {x: e.clientX, y: e.clientY, id: cardEl && cardEl.dataset.id, slot: slotEl && slotEl.dataset.slot, drag: false};
  if(P.id){
    const loc = locate(P.id);
    const pile = getPile(loc.ref);
    P.loc = loc;
    const draggable = loc.ref.k !== 's' && S.up[P.id] && (loc.ref.k === 't' || loc.index === pile.length - 1);
    if(draggable){ P.ids = pile.slice(loc.index); P.els = P.ids.map(i => els[i]); }
  }
  try{ board.setPointerCapture(e.pointerId); }catch(err){}
});
board.addEventListener('pointermove', e => {
  if(!P || !P.els) return;
  const dx = e.clientX - P.x, dy = e.clientY - P.y;
  if(!P.drag && Math.hypot(dx, dy) > 8){
    P.drag = true;
    P.els.forEach((el, i) => { el.classList.add('dragging'); el.style.zIndex = 3000 + i; });
  }
  if(P.drag){ P.dx = dx; P.dy = dy; P.els.forEach(el => el.style.transform = `translate(${dx}px,${dy}px)`); }
});
board.addEventListener('pointerup', () => {
  const p = P; P = null;
  if(!p) return;
  if(p.drag) drop(p);
  else if(p.id) tap(p.id);
  else if(p.slot === 's') draw();
});
board.addEventListener('pointercancel', () => {
  const p = P; P = null;
  if(p && p.drag){ settle(p); render(p.ids); }
});
function settle(p){
  p.els.forEach(el => {
    el.style.left = (parseFloat(el.style.left) + p.dx) + 'px';
    el.style.top = (parseFloat(el.style.top) + p.dy) + 'px';
    el.style.transform = '';
  });
  void board.offsetWidth;
  p.els.forEach(el => el.classList.remove('dragging'));
}
function drop(p){
  settle(p);
  const first = p.els[0];
  const r = {x: parseFloat(first.style.left), y: parseFloat(first.style.top), w: G.cw, h: G.ch};
  const overlap = t => Math.max(0, Math.min(r.x + r.w, t.x + t.w) - Math.max(r.x, t.x)) * Math.max(0, Math.min(r.y + r.h, t.y + t.h) - Math.max(r.y, t.y));

  if(p.ids.length === 1) for(let f = 0; f < 4; f++) cands.push({ref:{k:'f', i:f}, rect:{x:G.x(3 + f), y:0, w:G.cw, h:G.ch}});
  for(let c = 0; c < 7; c++) cands.push({ref:{k:'t', i:c}, rect:{x:G.x(c), y:G.tabY, w:G.cw, h:Math.max(G.H, G.colBottom[c] || 0) - G.tabY}});

    if(c.o <= 0) break;
    if(sameRef(c.ref, p.loc.ref)) continue;
    const ok = c.ref.k === 'f' ? canFound(id, c.ref.i) : canTab(id, c.ref.i);

/* ---------- game review ---------- */
// Two tracks through the game. "you" is what you played: states[0..n]. "win" shares
// your moves up to the turning point k, then follows a winning line from there.
// The view shows a position and describes the move made from it, with that move's
// cards outlined on the table.
const REVIEW_KEY = 'klondike-review-v1';
const canReview = () => { const g = live(); return !!(g && g.log && g.log.length && !g.won); };
function startReview(from){
  const real = live();
  if(!canReview()) return;
  const states = RV.replay(real.seed, real.draw, real.log);
  if(!states || !RV.sameTable(states[states.length - 1], real)){ toast("Couldn't replay this game"); return; }
  $('stuck').hidden = true; $('sheet').hidden = true;
  const n = states.length - 1;
  R = {real, from, states, n, stuck: isStuckState(real), track: 'you', i: n, tp: null, line: null, worker: null, tried: 0, playing: null};
  $('review').hidden = false; document.querySelector('.tools').hidden = true;
  const k = dealKey(real), logStr = JSON.stringify(real.log);
  let cached = null;
  try{ const c = JSON.parse(localStorage.getItem(REVIEW_KEY)); if(c && c.key === k && c.log === logStr) cached = c.tp; }catch(e){}
  if(cached) finishReview(cached, false);
  else runReview(states, k, logStr, real);
  show(true);
}
function runReview(states, k, logStr, real){
  const known = {}, v = verdicts[k];
  if(v === 'win' || v === 'lose') known[0] = v;
  if(R.stuck) known[R.n] = 'lose';
  const positions = states.map(toPos);
  const done = tp => {
    if(!R) return;
    R.worker = null;
    try{ localStorage.setItem(REVIEW_KEY, JSON.stringify({key: k, log: logStr, tp})); }catch(e){}
    finishReview(tp, true);
  };
  const job = {type: 'review', positions, known, ms: 90000, perMs: 25000, quickMs: 3000, tableBits: 21};
  try{
    if(!workerUrl) workerUrl = URL.createObjectURL(new Blob([$('klsrc').textContent + WORKER_GLUE], {type: 'text/javascript'}));
    const w = new Worker(workerUrl);
    R.worker = w;
    w.onmessage = e => {
      if(!R || R.worker !== w) return;
      if(e.data.type === 'progress'){ R.tried = e.data.tried; show(); }
      else { w.terminate(); done(e.data.tp); }
    };
    w.onerror = ev => { ev.preventDefault && ev.preventDefault(); if(R && R.worker === w){ R.worker = null; here(); } };
    w.postMessage(job);
  }catch(e){ here(); }
  // Without background workers: a shorter search on the page itself.
  function here(){ setTimeout(() => { if(!R) return; let tp; try{ tp = KL.turningPoint(positions, {...job, ms: 8000, quickMs: 1000, perMs: 4000}); }catch(e){ tp = {k: -1, lost: R.n + 1, exact: false}; } done(tp); }, 50); }
}
function isStuckState(g){ try{ return !KL.hasUsefulMove(toPos(g)); }catch(e){ return false; } }
function finishReview(tp, jump){
  R.tp = tp;
  if(tp.k >= 0 && tp.path){
    R.line = RV.lineFrom(R.states[tp.k], tp.path);
    if(!R.line) R.tp = {...tp, k: -1};
  }
  if(R.tp.k >= 0){ R.track = 'win'; R.i = R.tp.k; }
  show(true);
}
function endReview(){
  if(!R) return;
  stopPlay();
  if(R.worker){ R.worker.terminate(); R.worker = null; }
  const from = R.from;
  S = R.real; R = null;
  clearMarks();
  $('review').hidden = true; document.querySelector('.tools').hidden = false;
  board.classList.add('still'); render(); void board.offsetWidth; board.classList.remove('still');
  hud();
  if(from === 'stuck' && isStuck()) openStuck();
}

// Positions and moves on the current track.
function trackLen(){ return R.track === 'win' && R.line ? R.tp.k + R.line.steps.length : R.n; }
function stateAt(i){ return R.track === 'win' && R.line && i > R.tp.k ? R.line.states[i - R.tp.k] : R.states[i]; }
function moveAt(i){
  // {kind:'you', act} for one of your moves, {kind:'win', step} for the winning line.
  if(R.track === 'win' && R.line && i >= R.tp.k) return i - R.tp.k < R.line.steps.length ? {kind: 'win', step: R.line.steps[i - R.tp.k]} : null;
  return i < R.n ? {kind: 'you', act: R.real.log[i]} : null;
}
function step(d){ stopPlay(); go(R.i + d); }
function go(i, still){
  if(!R) return;
  const prevI = R.i;
  i = Math.max(0, Math.min(trackLen(), i));
  const boost = i === prevI + 1 ? movedIds(prevI) : null;
  R.i = i;
  show(still || Math.abs(i - prevI) > 1, boost);
}
function movedIds(i){
  const m = moveAt(i); if(!m) return null;
  const g = stateAt(i);
  if(m.kind === 'you') return RV.cardsOf(g, m.act);
  const a = m.step.acts[m.step.taps];
  const h = RV.clone(g); for(let t = 0; t < m.step.taps; t++) RV.apply(h, m.step.acts[t]);
  return a && !a.d ? RV.cardsOf(h, a) : null;
}
function clearMarks(){
  board.querySelectorAll('.mark-you,.mark-win').forEach(el => el.classList.remove('mark-you', 'mark-win'));
}
// Outline the cards a move picks up and where they land.
function markAct(g, a, cls){
  if(a.d){ const el = g.stock.length ? els[last(g.stock)] : slots.s; el.classList.add(cls); return; }
  RV.cardsOf(g, a).forEach(id => els[id].classList.add(cls));
  const dst = RV.pile(g, a.t);
  (dst.length ? els[last(dst)] : slots[a.t.k + a.t.i]).classList.add(cls);
}
function markStep(g, st, cls){
  if(st.finish) return;
  if(st.taps){ (g.stock.length ? els[last(g.stock)] : slots.s).classList.add(cls); const dst = st.acts[st.taps].t; const p = RV.pile(g, dst); (p.length ? els[last(p)] : slots[dst.k + dst.i]).classList.add(cls); return; }
  markAct(g, st.acts[0], cls);
}
const el = (tag, cls, text) => { const e = document.createElement(tag); if(cls) e.className = cls; if(text != null) e.textContent = text; return e; };
function row(tagCls, tagText, text){ const r = el('div', 'rv-row'); r.append(el('span', 'tag ' + tagCls, tagText), el('span', '', text)); return r; }

function show(still, boost){
  const tp = R.tp, i = R.i, n = R.n, k = tp ? tp.k : -1;
  const g = stateAt(i);
  S = {...RV.clone(g), seed: R.real.seed, draw: R.real.draw, moves: i, elapsed: R.real.elapsed, started: true, won: false};
  if(still){ board.classList.add('still'); render(); void board.offsetWidth; board.classList.remove('still'); }
  else render(boost);
  hud();
  clearMarks();

  // tabs
  const hasLine = !!(tp && R.line);
  $('rvWin').disabled = !hasLine;
  $('rvYou').setAttribute('aria-selected', R.track === 'you');
  $('rvWin').setAttribute('aria-selected', R.track === 'win');
  $('rvJump').hidden = !hasLine || i === k;

  // where we are, and whether the deal could still be won from here
  const len = trackLen(), onLine = R.track === 'win' && hasLine && i > k;
  $('rvCount').textContent = onLine ? `Winning line · step ${i - k} of ${len - k}` : i < n ? `Move ${i + 1} of ${n}` : `End · ${n} moves`;
  const st = $('rvState');
  st.hidden = !tp;
  if(tp){
    let cls = 'maybe', txt = 'Not sure';
    if(onLine || (k >= 0 && i <= k)){ cls = 'ok'; txt = 'Winnable'; }
    else if(i >= tp.lost){ cls = 'lost'; txt = 'Lost'; }
    st.className = 'state ' + cls; st.textContent = txt;
  }

  // what happens next
  const body = $('rvBody'); body.replaceChildren();
  const m = moveAt(i);
  if(!tp){
    body.append(el('p', 'rv-text', 'Finding the move where this game slipped away…'),
      el('p', 'rv-sub', R.tried ? `Checked ${R.tried} position${R.tried === 1 ? '' : 's'} so far. You can step through your game meanwhile.` : 'This usually takes a few seconds, sometimes up to a minute and a half.'));
    if(m) markAct(g, m.act, 'mark-you'), body.append(row('you', 'You', RV.actText(g, m.act)));
  } else if(hasLine && i === k){
    // The turning point: your move and the winning move side by side.
    const yours = i < n ? RV.actText(g, R.real.log[i]) : null;
    const win = R.line.steps.length ? RV.stepText(R.line.steps[0]) : 'Nothing: the game is won from here';
    if(i < n) markAct(g, R.real.log[i], 'mark-you');
    if(R.line.steps.length) markStep(g, R.line.steps[0], 'mark-win');
    if(i === n){
      body.append(el('p', 'rv-text', 'You can still win this one. Here is the way through:'), row('win', 'Next', win));
    } else {
      body.append(row('you', 'You', yours), row('win', 'Win', win));
      body.append(el('p', 'rv-sub', tp.exact
        ? 'Until here the deal could still be won; after your move it couldn’t. The winning line knows where every card is, face-down ones included.'
        : `The last point a win could be confirmed. By move ${Math.min(tp.lost, n)} it was certainly lost. The winning line knows where every card is.`));
    }
  } else if(m && m.kind === 'win'){
    markStep(g, m.step, 'mark-win');
    body.append(row('win', 'Win', RV.stepText(m.step)));
  } else if(m){
    markAct(g, m.act, 'mark-you');
    body.append(row('you', 'You', RV.actText(g, m.act)));
    if(hasLine && i < k && i === 0) body.append(el('p', 'rv-sub', `Your first ${k} moves kept the deal winnable. Jump to the turning point to see where it went wrong.`));
  } else if(R.track === 'win' && hasLine){
    body.append(el('p', 'rv-text', 'Won. Every card is on the foundations.'), el('p', 'rv-sub', 'Replay the deal to try it yourself.'));
  } else {
    body.append(el('p', 'rv-text', R.stuck ? 'This is where you ran out of useful moves.' : 'This is where your game is now.'));
    if(hasLine) body.append(el('p', 'rv-sub', 'Switch to Winning line to see how it could have gone.'));
  }
  if(tp && k < 0 && i === n){
    body.replaceChildren(el('p', 'rv-text', tp.lost === 0
      ? 'This deal couldn’t be won from the start, even knowing where every card was. Nothing you did lost it.'
      : 'This deal was too complex to check all the way through, so there’s no winning line to show.'));
    if(tp.lost > 0 && tp.lost <= n) body.append(el('p', 'rv-sub', `It was certainly lost by move ${tp.lost}.`));
  }

  $('rvStart').disabled = i === 0;
  $('rvPrev').disabled = i === 0;
  $('rvNext').disabled = i >= len;
  $('rvPlay').disabled = i >= len && !R.playing;
  $('rvPlay').textContent = R.playing ? 'Pause' : 'Play';
}
function stopPlay(){ if(R && R.playing){ clearInterval(R.playing); R.playing = null; } }
function togglePlay(){
  if(R.playing){ stopPlay(); show(true); return; }
  if(R.i >= trackLen()) return;
  R.playing = setInterval(() => {
    if(!R || R.i >= trackLen()){ stopPlay(); if(R) show(true); return; }
    go(R.i + 1);
  }, reduced ? 1400 : 1100);
  show(true);
}
function setTrack(t){
  if(!R || R.track === t || (t === 'win' && !R.line)) return;
  stopPlay();
  R.track = t;
  // Past the turning point the tracks differ, so jump back to it.
  if(R.tp && R.tp.k >= 0 && R.i > R.tp.k) R.i = R.tp.k;
  show(true);
}
$('rvYou').onclick = () => setTrack('you');
$('rvWin').onclick = () => setTrack('win');
$('rvPrev').onclick = () => step(-1);
$('rvNext').onclick = () => step(1);
$('rvStart').onclick = () => { stopPlay(); go(0, true); };
$('rvPlay').onclick = togglePlay;
$('rvJump').onclick = () => { stopPlay(); go(R.tp.k, true); };
$('rvClose').onclick = endReview;
$('rvReplay').onclick = () => { const g = R.real; endReview(); newGame(g.draw, g.seed); };
$('stReview').onclick = () => startReview('stuck');
$('optReview').onclick = () => startReview('menu');

/* ---------- menus ---------- */
// Easy and Normal pick a deal that is checked before you see it:
//   Easy   - a plain strategy that only looks at face-up cards wins it, played two
//            slightly different ways (KL.playsOut), so ordinary sensible play works.
//   Normal - the solver finds a win with every card visible (a quick check; deals it
//            can't settle fast are skipped).
//   Hard   - any shuffle, as dealt.
// Either way the deal is still a fair shuffle; Easy and Normal just skip some.
const randomSeed = () => Math.floor(Math.random() * 900000) + 100000;
function pickSeed(draw, lv){
  if(lv === 'hard') return randomSeed();
  const until = Date.now() + 1500;
  let tries = 0;
  while(Date.now() < until || tries < 3){
    const seed = randomSeed(), pos = toPos(deal(seed, draw));
    tries++;
    let ok = false;
    try{
      ok = lv === 'easy' ? KL.playsOut(pos, 0) && KL.playsOut(pos, 1)
        : KL.solve(pos, {maxNodes: 5000, tableBits: 17}).result === 'win';
    }catch(e){}
    if(ok){ verdicts[seed + ':' + draw] = 'win'; saveVerdicts(); return seed; }
  }
  return randomSeed();
}
function newGame(draw, seed, lv){
  lv = lv || (seed != null && S ? levelOf(S) : level);
  S = deal(seed ?? pickSeed(draw, lv), draw);
  S.level = lv;
  history = [];
  $('win').hidden = true; $('stuck').hidden = true; $('sheet').hidden = true;
  save(); hud(); dealAnim();
  requestVerdict();
}
function openSheet(){
  $('record').textContent = stats.played ? recordLine() : 'Your first game is on the table';
  showLevel();
  $('replayLabel').textContent = `Replay deal ${S.seed}`;
  $('optD1').classList.toggle('current', S.draw === 1);
  $('optD3').classList.toggle('current', S.draw === 3);
  $('optReview').hidden = !canReview();
  $('sheet').hidden = false;
}
const closeSheet = () => $('sheet').hidden = true;
$('btnNew').onclick = openSheet;
$('btnHint').onclick = hint;
$('btnUndo').onclick = undo;
function showLevel(){
  document.querySelectorAll('.seg.level button').forEach(b => b.setAttribute('aria-selected', b.dataset.level === level));
  $('levelNote').textContent = LEVELS[level].note;
}
document.querySelectorAll('.seg.level button').forEach(b => b.onclick = () => {
  level = b.dataset.level;
  try{ localStorage.setItem(LEVEL_KEY, level); }catch(e){}
  showLevel();
});
$('optD1').onclick = () => newGame(1);
$('optD3').onclick = () => newGame(3);
$('optReplay').onclick = () => newGame(S.draw, S.seed);
$('optClose').onclick = closeSheet;
$('sheet').addEventListener('click', e => { if(e.target.id === 'sheet') closeSheet(); });
$('stRestart').onclick = () => newGame(S.draw, S.seed);
$('stNew').onclick = () => newGame(S.draw, null, level);
$('stUndo').onclick = () => { $('stuck').hidden = true; undo(); };
$('stClose').onclick = closeStuck;
$('stuck').addEventListener('click', e => { if(e.target.id === 'stuck') closeStuck(); });
$('btnAgain').onclick = () => newGame(S.draw, null, level);
document.addEventListener('keydown', e => {
  if(R){
    if(e.key === 'ArrowRight') step(1);
    else if(e.key === 'ArrowLeft') step(-1);
    else if(e.key === 'Escape') endReview();
    return;
  }
  if(e.key === 'Escape'){ closeSheet(); closeStuck(); }
  if((e.ctrlKey || e.metaKey) && e.key === 'z'){ e.preventDefault(); undo(); }
});

/* ---------- clock ---------- */
setInterval(() => {
  if(S && !R && S.started && !S.won && !document.hidden && $('sheet').hidden && $('stuck').hidden){
    S.elapsed++; $('time').textContent = fmt(S.elapsed);
    if(S.elapsed % 5 === 0) save();
  }
}, 1000);
document.addEventListener('visibilitychange', () => { if(document.hidden && S) save(); });

/* ---------- boot ---------- */
function start(data){
  makeSlot('s', '', 'stock');
  for(let f = 0; f < 4; f++) makeSlot('f' + f, 'A');
  for(let c = 0; c < 7; c++) makeSlot('t' + c, 'K');
  for(const s of SUITS) for(let k = 1; k <= 13; k++) els[s + k] = makeCard(s + k);
  computeLayout();

  const saved = data && data.S ? data.S : load();
  if(data && data.history) history = data.history;
  if(saved && !saved.won){
    S = saved;
    board.classList.add('still'); render(); void board.offsetWidth; board.classList.remove('still');
    hud();
    requestVerdict();
    scheduleStuck();
  } else {
    newGame(saved ? saved.draw : 1);
  }
  new ResizeObserver(() => {
    if(!S) return;
    board.classList.add('still'); computeLayout(); render();
    requestAnimationFrame(() => board.classList.remove('still'));
  }).observe(board);
}
try{ window.claude?.hot?.snapshot?.(() => ({S: live(), history})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
