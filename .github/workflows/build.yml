name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Files uploaded through the GitHub website lose the executable bit.
      - name: Make gradlew executable
        run: chmod +x gradlew

      # Every solution the solver finds is replayed move by move with a separate rules check.
      - name: Check the deal solver
        run: node test/verify.js

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log

      - name: Report errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Exception" gradle.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: solitaire-apk
          path: app/build/outputs/apk/debug/*.apk

      # A fixed download link for your phone:
      # https://github.com/<you>/<repo>/releases/latest/download/Solitaire.apk
      - name: Publish as the latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Solitaire.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Solitaire.apk --target "$GITHUB_SHA" --latest \
            --title "Solitaire (build ${{ github.run_number }})" \
            --notes "On your Android phone, download Solitaire.apk and open it to install or update. Your saved game and record carry over between updates."
